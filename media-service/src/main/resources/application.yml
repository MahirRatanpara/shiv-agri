server:
  port: 8081

spring:
  application:
    name: media-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/shiv-agri}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

media:
  storage:
    active-backend: ${MEDIA_STORAGE_ACTIVE_BACKEND:filesystem}
    max-file-size-bytes: 26214400
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
      - video/mp4
      - video/quicktime
      - video/webm
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
      - text/markdown
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - mp4
      - mov
      - webm
      - pdf
      - doc
      - docx
      - txt
      - md
    filesystem:
      root-dir: ${MEDIA_STORAGE_FILESYSTEM_ROOT_DIR:/Users/mahirratanpara/uploads}

  # Static CDN surface (/api/v1/cdn/**). Files land here via the "Sync CDN Static
  # Assets" workflow, NOT through the upload API — separate root, separate volume.
  cdn:
    root-dir: ${MEDIA_CDN_ROOT_DIR:/var/media/static}
    cache-max-age-seconds: ${MEDIA_CDN_CACHE_MAX_AGE_SECONDS:604800}
    chunk-size-bytes: ${MEDIA_CDN_CHUNK_SIZE_BYTES:4194304}
    accel:
      # Enable ONLY when nginx fronts this service and has the matching
      # `internal` location. Prod sets MEDIA_CDN_ACCEL_ENABLED=true; local dev
      # leaves it false so bytes stream from Java instead.
      enabled: ${MEDIA_CDN_ACCEL_ENABLED:false}
      internal-prefix: ${MEDIA_CDN_ACCEL_INTERNAL_PREFIX:/internal-static/}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.shivagri.media: INFO
