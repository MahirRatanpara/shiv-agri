<div class="dashboard-wrapper">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Farm Dashboard</h1>
      <p class="page-subtitle">Manage and track your farm projects</p>
    </div>
    <div class="header-actions">
      <button class="filter-toggle-btn" (click)="toggleFilters()" [class.active]="filtersOpen || activeFilterCount > 0">
        <i class="fas fa-sliders-h"></i>
        Filters
        <span class="filter-badge" *ngIf="activeFilterCount > 0">{{ activeFilterCount }}</span>
      </button>
      <a routerLink="/projects/new" class="new-project-btn">
        <i class="fas fa-plus"></i>
        <span class="btn-label">New Project</span>
      </a>
    </div>
  </div>

  <!-- Dashboard Overview -->
  <app-dashboard-overview [stats]="stats" [loading]="statsLoading"></app-dashboard-overview>

  <!-- Project List -->
  <div class="list-section">
    <app-project-list
      [projects]="projects"
      [pagination]="pagination"
      [loading]="loading"
      [viewMode]="viewMode"
      (pageChange)="onPageChange($event)"
      (favoriteToggle)="onFavoriteToggle($event)"
      (viewModeChange)="onViewModeChange($event)"
      (sortChange)="onSortChange($event)"
      (searchChange)="onSearchChange($event)"
      (bulkAction)="onBulkAction($event)">
    </app-project-list>
  </div>

  <!-- Filter Drawer -->
  <app-project-filters
    [filters]="filters"
    [isOpen]="filtersOpen"
    (filtersChange)="onFiltersChange($event)"
    (close)="filtersOpen = false">
  </app-project-filters>
</div>
