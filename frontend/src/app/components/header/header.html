<header class="header-style-2">
  <nav class="navbar navbar-expand-lg">
    <img class="navbar-brand" routerLink="/home" ngSrc="assets/images/Logo/ahLogo.png" alt="" height="1024"
         width="1536">
    <!-- Signed-out users get Login on the bar itself, not buried in the menu.
         Hidden on desktop, where the auth-nav Login link is already visible. -->
    <a class="mobile-login-btn" *ngIf="!isAuthenticated" routerLink="/login">
      <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
      Login
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fas fa-bars"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home"> Home </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact"> Contact </a>
        </li>
        <li class="nav-item" *ngIf="isAuthenticated && hasLabTestingAccess">
          <a class="nav-link" routerLink="/lab-testing">
            <i class="fas fa-microscope"></i> Lab
          </a>
        </li>
        <li class="nav-item" *ngIf="isAuthenticated && hasFarmDashboardAccess">
          <a class="nav-link" routerLink="/farm-management">
            <i class="fas fa-tractor"></i> Farms
          </a>
        </li>
        <li class="nav-item" *ngIf="isAuthenticated && hasManagerialWorkAccess">
          <a class="nav-link" routerLink="/managerial-work">
            <i class="fas fa-file-invoice"></i> Managerial
          </a>
        </li>
        <li class="nav-item admin-menu" *ngIf="isAuthenticated && currentUser?.role === 'admin'">
          <a class="nav-link admin-menu-toggle"
             href="#"
             role="button"
             [attr.aria-expanded]="isAdminMenuOpen"
             (click)="toggleAdminMenu($event)">
            <i class="fas fa-user-shield"></i> Admin
            <i class="fas fa-chevron-down admin-caret" [class.open]="isAdminMenuOpen"></i>
          </a>
          <ul class="admin-submenu" [class.show]="isAdminMenuOpen">
            <li>
              <a class="nav-link" routerLink="/admin/users" (click)="closeAdminMenu()">
                <i class="fas fa-users"></i> User Management
              </a>
            </li>
            <li>
              <a class="nav-link" routerLink="/admin/whatsapp-delivery" (click)="closeAdminMenu()">
                <i class="fab fa-whatsapp"></i> WhatsApp Delivery
              </a>
            </li>
          </ul>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto auth-nav">
        <li class="nav-item" *ngIf="isAuthenticated">
          <app-notification-bell></app-notification-bell>
        </li>
        <li class="nav-item" *ngIf="!isAuthenticated">
          <a class="nav-link" routerLink="/login">
            <i class="fas fa-sign-in-alt"></i> Login
          </a>
        </li>
        <li class="nav-item" *ngIf="isAuthenticated && currentUser">
          <a class="nav-link" routerLink="/my-account">
            <img
              *ngIf="currentUser.profilePhoto && !profileImageLoadError"
              [src]="currentUser.profilePhoto"
              (error)="onProfileImageError()"
              alt="{{ currentUser.name }}"
              class="user-avatar">
            <span *ngIf="!currentUser.profilePhoto || profileImageLoadError" class="user-avatar-placeholder">
              {{ currentUser.name.charAt(0).toUpperCase() }}
            </span>
          </a>
        </li>
        <li class="nav-item" *ngIf="isAuthenticated">
          <a class="nav-link logout-link" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>
<div id="search">
  <button type="button" class="close">×</button>
  <form class="search-overlay-form">
    <input type="search" value="" placeholder="type keyword(s) here" />
    <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
  </form>
</div>
