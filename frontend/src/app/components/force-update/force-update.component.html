@if (info(); as update) {
  <div class="fu-overlay" role="alertdialog" aria-modal="true" aria-labelledby="fu-title">
    <div class="fu-card">
      <div class="fu-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
      </div>

      <h1 id="fu-title" class="fu-title">Update required</h1>

      <p class="fu-message">{{ update.message || defaultMessage }}</p>

      @if (update.latestVersionName) {
        <p class="fu-version">Latest version: {{ update.latestVersionName }}</p>
      }

      <button type="button" class="fu-btn" (click)="onUpdate()" [disabled]="!update.updateUrl">
        Update now
      </button>

      @if (!update.updateUrl) {
        <p class="fu-fallback">
          Please reinstall Shiv Agri from the link your administrator shared with you.
        </p>
      }
    </div>
  </div>
}
