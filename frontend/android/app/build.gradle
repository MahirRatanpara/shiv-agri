apply plugin: 'com.android.application'

// Release signing config. Reads credentials from android/keystore.properties
// (git-ignored) if present, otherwise from environment variables (used by CI).
// If neither is available the release build is left unsigned so local/CI debug
// builds still work.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def ksStoreFileName = keystoreProps['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_FILE')
def ksStorePassword = keystoreProps['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def ksKeyAlias = keystoreProps['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def ksKeyPassword = keystoreProps['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
// storeFile is resolved relative to android/ (where keystore.properties lives);
// absolute paths from env vars are used as-is.
def ksStoreFile = ksStoreFileName != null ? rootProject.file(ksStoreFileName) : null
def hasSigning = ksStoreFile != null && ksStoreFile.exists()

// Release version. CI derives both values from the git tag being built and
// passes them in (see scripts/app-version.sh and .github/workflows/mobile-build.yml):
//   ./gradlew bundleRelease -PappVersionCode=50200 -PappVersionName=5.2.0
// A plain local build supplies neither and falls back to the literals below, so
// `./gradlew assembleDebug` keeps working with no arguments.
//
// The fallbacks are deliberately the LOWEST shippable values rather than the
// latest ones: if the override ever fails to arrive, the build produces an
// obviously-stale version instead of silently claiming to be the new release.
def FALLBACK_VERSION_CODE = 6
def FALLBACK_VERSION_NAME = "5.1.0"

def appVersionCode = (project.findProperty('appVersionCode')
        ?: System.getenv('ANDROID_VERSION_CODE'))?.toString()?.trim()
def appVersionName = (project.findProperty('appVersionName')
        ?: System.getenv('ANDROID_VERSION_NAME'))?.toString()?.trim()

def resolvedVersionCode = appVersionCode ? appVersionCode.toInteger() : FALLBACK_VERSION_CODE
def resolvedVersionName = appVersionName ?: FALLBACK_VERSION_NAME

if (resolvedVersionCode < FALLBACK_VERSION_CODE) {
    // Play rejects a versionCode at or below one already uploaded, and the
    // backend gate compares against this integer -- a lower one here would make
    // a new build look older than the build it replaces.
    throw new GradleException(
        "appVersionCode ${resolvedVersionCode} is below the last shipped code ${FALLBACK_VERSION_CODE}")
}
logger.lifecycle("[version] versionCode=${resolvedVersionCode} versionName=${resolvedVersionName}" +
    (appVersionCode ? "" : " (fallback -- no -PappVersionCode supplied)"))

android {
    namespace = "com.shivagri.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shivagri.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Resolved above: CI passes -PappVersionCode / -PappVersionName derived
        // from the git tag; local builds get the fallback literals. The integer
        // is what the backend's ANDROID_MIN_VERSION_CODE gate compares against
        // (see backend/src/config/appVersion.js); versionName is display-only.
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile ksStoreFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
