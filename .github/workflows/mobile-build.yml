name: Build Mobile Apps

# Produces the deployable native packages (Android APK/AAB, iOS archive) as CI
# artifacts so they never have to be committed to the repo. The native project
# SOURCE lives in frontend/android and frontend/ios; the built packages are
# generated here on demand.
#
# Triggers:
#   - push of a tag like v1.2.3  -> full build, artifacts attached to the run
#   - manual "Run workflow"      -> on-demand build from any branch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 5.2.0 (blank = the fallback in build.gradle)'
        required: false
        type: string

defaults:
  run:
    working-directory: frontend

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    # Mapped here because the `secrets` context is not available in step-level
    # `if:` conditions, but `env` is. Signing is skipped when these are empty.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Must stay on v4 or newer: v3 asks sdkmanager for the long-retired `tools`
      # package and dies with "Failed to find package 'tools'". `packages: ''`
      # skips the install entirely -- the runner image already ships
      # platform-tools, and Gradle fetches the compileSdk platform + build-tools
      # itself once this step has accepted the SDK licences.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      # Tag builds get their version from the tag itself: v5.2.0 -> versionCode
      # 50200, versionName 5.2.0 (scripts/app-version.sh explains the mapping).
      # A manual run has no tag, so it builds with the fallback literals in
      # app/build.gradle -- a test build must not claim to be a release.
      - name: Resolve app version
        id: appver
        working-directory: .
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            scripts/app-version.sh "${{ github.ref_name }}" | tee -a "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            # Manual override, for rehearsing a release build without tagging.
            scripts/app-version.sh "${{ inputs.version }}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "No tag and no version input -- building with the fallback in build.gradle." >&2
          fi

      # Passed to both Gradle invocations. Empty for a manual run.
      - name: Compose Gradle version args
        id: gradleargs
        working-directory: .
        run: |
          if [ -n "${{ steps.appver.outputs.version_code }}" ]; then
            echo "args=-PappVersionCode=${{ steps.appver.outputs.version_code }} -PappVersionName=${{ steps.appver.outputs.version_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx ng build --configuration production

      - name: Sync Capacitor (android)
        run: npx cap sync android

      # Decode the release keystore + write keystore.properties, but only when
      # the signing secrets are configured. If they are missing the release
      # bundle is still built, just unsigned. Configure these repo secrets to
      # get a Play-Store-ready signed AAB:
      #   ANDROID_KEYSTORE_BASE64   (base64 of shiv-agri-release.jks)
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/shiv-agri-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=shiv-agri-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon ${{ steps.gradleargs.outputs.args }}

      # Release AAB is what you upload to the Play Store. Signed automatically
      # when the signing secrets above are set; otherwise built unsigned.
      - name: Build release bundle
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon ${{ steps.gradleargs.outputs.args }}

      # Ships the resolved version alongside the binaries so the values fed to
      # the promote-app-version workflow are read off the build itself rather
      # than retyped from memory. aapt2 is the authority: it reports what was
      # actually baked into the package, not what we asked for.
      - name: Record built version
        working-directory: frontend/android
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          CODE="${{ steps.appver.outputs.version_code }}"
          NAME="${{ steps.appver.outputs.version_name }}"
          if [ -n "$AAPT" ]; then
            BADGE=$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -1 || true)
            echo "aapt2 reports: $BADGE"
            PARSED_CODE=$(echo "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            PARSED_NAME=$(echo "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            [ -n "$PARSED_CODE" ] && CODE="$PARSED_CODE"
            [ -n "$PARSED_NAME" ] && NAME="$PARSED_NAME"
          fi
          {
            echo "ANDROID_LATEST_VERSION_CODE=$CODE"
            echo "ANDROID_LATEST_VERSION_NAME=$NAME"
          } > app-version.env
          echo "--- app-version.env ---"
          cat app-version.env
          {
            echo "### Android build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| versionCode | \`$CODE\` |"
            echo "| versionName | \`$NAME\` |"
            echo ""
            echo "Promote with the **Promote App Version** workflow once tested."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          if-no-files-found: error
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app-version.env

  ios:
    name: iOS (archive)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx ng build --configuration production

      - name: Sync Capacitor (ios)
        run: npx cap sync ios

      # Compiles the app to validate the iOS build without requiring signing
      # certificates in CI. A distributable .ipa needs Apple signing secrets and
      # `-exportArchive`; add those (Fastlane match or manual certs) when you set
      # up TestFlight/App Store delivery.
      - name: Build (no code signing)
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -target App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
