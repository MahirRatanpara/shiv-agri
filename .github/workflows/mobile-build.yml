name: Build Mobile Apps

# Produces the deployable native packages (Android APK/AAB, iOS archive) as CI
# artifacts so they never have to be committed to the repo. The native project
# SOURCE lives in frontend/android and frontend/ios; the built packages are
# generated here on demand.
#
# Triggers:
#   - push of a tag like v1.2.3  -> full build, artifacts attached to the run
#   - manual "Run workflow"      -> on-demand build from any branch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    # Mapped here because the `secrets` context is not available in step-level
    # `if:` conditions, but `env` is. Signing is skipped when these are empty.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx ng build --configuration production

      - name: Sync Capacitor (android)
        run: npx cap sync android

      # Decode the release keystore + write keystore.properties, but only when
      # the signing secrets are configured. If they are missing the release
      # bundle is still built, just unsigned. Configure these repo secrets to
      # get a Play-Store-ready signed AAB:
      #   ANDROID_KEYSTORE_BASE64   (base64 of shiv-agri-release.jks)
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/shiv-agri-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=shiv-agri-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      # Release AAB is what you upload to the Play Store. Signed automatically
      # when the signing secrets above are set; otherwise built unsigned.
      - name: Build release bundle
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          if-no-files-found: error
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS (archive)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx ng build --configuration production

      - name: Sync Capacitor (ios)
        run: npx cap sync ios

      # Compiles the app to validate the iOS build without requiring signing
      # certificates in CI. A distributable .ipa needs Apple signing secrets and
      # `-exportArchive`; add those (Fastlane match or manual certs) when you set
      # up TestFlight/App Store delivery.
      - name: Build (no code signing)
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -target App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
