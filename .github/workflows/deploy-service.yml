name: Deploy Service (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Docker compose service name (e.g. api, frontend, nginx, media-service)'
        required: true
        type: string
      context_path:
        description: 'Docker build context path (e.g. ./backend, ./media-service)'
        required: true
        type: string
      image_suffix:
        description: 'DockerHub image name suffix (e.g. shiv-agri-api, shiv-agri-media)'
        required: true
        type: string
      use_build_cache:
        description: 'Use Docker registry build cache'
        required: false
        type: boolean
        default: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_suffix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ inputs.use_build_cache && format('type=registry,ref={0}:buildcache', env.IMAGE_NAME) || '' }}
          cache-to: ${{ inputs.use_build_cache && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}

      - name: Deploy to Hostinger VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/shiv-agri

            if [ -f .env ]; then
              export $(cat .env | grep -v '^#' | xargs)
              echo "✓ Environment variables loaded from .env"
            else
              echo "⚠ Warning: .env file not found"
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            docker compose -f docker-compose.prod.yml pull ${{ inputs.service_name }}
            docker compose -f docker-compose.prod.yml up -d ${{ inputs.service_name }}
            docker image prune -f
            echo "✅ ${{ inputs.service_name }} deployment completed successfully!"

      - name: Create deployment summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## ${{ inputs.service_name }} Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ ${{ inputs.service_name }} deployment completed successfully" >> $GITHUB_STEP_SUMMARY
