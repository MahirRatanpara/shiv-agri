name: Deploy Service (Reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Docker compose service name (e.g. api, frontend, nginx, media-service)'
        required: true
        type: string
      context_path:
        description: 'Docker build context path (e.g. ./backend, ./media-service)'
        required: true
        type: string
      image_suffix:
        description: 'DockerHub image name suffix (e.g. shiv-agri-api, shiv-agri-media)'
        required: true
        type: string
      use_build_cache:
        description: 'Use Docker registry build cache'
        required: false
        type: boolean
        default: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_suffix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ inputs.use_build_cache && format('type=registry,ref={0}:buildcache', env.IMAGE_NAME) || '' }}
          cache-to: ${{ inputs.use_build_cache && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}

      - name: Setup SSH key
        if: github.ref == 'refs/heads/main'
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' > ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to Hostinger VPS
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" << EOF
          set -e
          cd /var/www/shiv-agri
          [ -f .env ] && export \$(cat .env | grep -v '^#' | xargs)
          echo "${DOCKER_TOKEN}" | docker login -u "${DOCKER_USER}" --password-stdin 2>/dev/null
          docker compose -f docker-compose.prod.yml pull --quiet ${SERVICE_NAME}
          docker compose -f docker-compose.prod.yml up -d --no-deps ${SERVICE_NAME}
          nohup docker image prune -f > /dev/null 2>&1 &
          echo "✅ ${SERVICE_NAME} deployed successfully!"
          EOF
          rm -f ~/.ssh/deploy_key ~/.ssh/config
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVICE_NAME: ${{ inputs.service_name }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create deployment summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## ${{ inputs.service_name }} Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ ${{ inputs.service_name }} deployment completed successfully" >> $GITHUB_STEP_SUMMARY
