name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    secrets: inherit
    with:
      service_name: frontend
      context_path: ./frontend
      image_suffix: shiv-agri-frontend
