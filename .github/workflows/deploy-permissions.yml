name: Deploy Database Permissions

on:
  # Called by deploy-api workflow before API deployment
  workflow_call:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (preview changes only)'
        required: false
        type: boolean
        default: false
      force_update:
        description: 'Force update of system roles'
        required: false
        type: boolean
        default: false
      triggered_by:
        description: 'Workflow that triggered this (for tracking)'
        required: false
        type: string
        default: 'manual'

  # Manual trigger only - no automatic push triggers
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (preview changes only)'
        required: false
        type: boolean
        default: true
      force_update:
        description: 'Force update of system roles'
        required: false
        type: boolean
        default: false

jobs:
  validate-and-deploy:
    name: Validate and Deploy Permissions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate permissions.yml
        working-directory: backend
        run: |
          echo "Validating permissions configuration..."
          node -e "
            const fs = require('fs');
            const yaml = require('js-yaml');
            const path = require('path');

            try {
              const config = yaml.load(fs.readFileSync('src/config/permissions.yml', 'utf8'));

              if (!config.permissions || !Array.isArray(config.permissions)) {
                throw new Error('Invalid config: missing or invalid permissions array');
              }

              if (!config.roles || !Array.isArray(config.roles)) {
                throw new Error('Invalid config: missing or invalid roles array');
              }

              console.log('✓ Configuration is valid');
              console.log(\`  Permissions: \${config.permissions.length}\`);
              console.log(\`  Roles: \${config.roles.length}\`);
            } catch (error) {
              console.error('✗ Configuration validation failed:', error.message);
              process.exit(1);
            }
          "

      - name: Copy permissions.yml to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/src/config/permissions.yml"
          target: "/tmp/permissions-deploy"
          strip_components: 3

      - name: Copy to container and run migration
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/shiv-agri

            # docker compose reads .env from this directory itself — don't export it through
            # the shell, which word-splits values that contain spaces.
            if [ -f .env ]; then
              echo "✓ .env found (docker compose loads it directly)"
            else
              echo "⚠ Warning: .env file not found"
            fi

            # Ensure API container is running
            if ! docker ps | grep -q shivagri-api; then
              echo "⚠️  API container is not running. Starting it now..."
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
              docker compose -f docker-compose.prod.yml pull api
              docker compose -f docker-compose.prod.yml up -d api
              echo "⏳ Waiting for API container to be ready..."
              sleep 15
            fi

            # Copy permissions.yml from server into the running container
            echo "📋 Copying permissions.yml into container..."
            docker cp /tmp/permissions-deploy/permissions.yml shivagri-api:/app/src/config/permissions.yml
            echo "✓ permissions.yml copied to container"

            # Verify the file exists in container
            if docker exec shivagri-api test -f /app/src/config/permissions.yml; then
              echo "✓ permissions.yml verified in container"
            else
              echo "✗ permissions.yml not found in container after copy"
              exit 1
            fi

            # Determine migration mode
            DRY_RUN="${{ inputs.dry_run }}"
            FORCE_UPDATE="${{ inputs.force_update }}"

            if [ "$DRY_RUN" == "true" ]; then
              echo "🔍 Running migration in DRY RUN mode..."
              echo "No changes will be made to the database"
              docker exec shivagri-api npm run migrate:permissions:dry-run
            elif [ "$FORCE_UPDATE" == "true" ]; then
              echo "⚠️  Running migration with FORCE UPDATE..."
              echo "System roles will be updated"
              docker exec shivagri-api npm run migrate:permissions:force
            else
              echo "🚀 Running permission migration..."
              docker exec shivagri-api npm run migrate:permissions
            fi

            # Clean up temp file
            rm -rf /tmp/permissions-deploy
            echo "✅ Permission migration completed successfully!"

      - name: Create deployment summary
        run: |
          TRIGGER_SOURCE="${{ inputs.triggered_by || 'workflow_dispatch' }}"

          echo "## Permission Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TRIGGER_SOURCE" == "deploy-api" ]; then
            echo "**Mode:** Automatic (Before API deployment)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** Manual (Standalone)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "**Server:** ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Force Update:** ${{ inputs.force_update || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Permission migration completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** permissions.yml copied explicitly from repo to container" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Permission Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The permission migration failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
