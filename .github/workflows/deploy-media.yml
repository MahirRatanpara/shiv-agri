name: Deploy Media Service

on:
  push:
    branches: [main]
    paths:
      - 'media-service/**'
      - '.github/workflows/deploy-media.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    secrets: inherit
    with:
      service_name: media-service
      context_path: ./media-service
      image_suffix: shiv-agri-media
