version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: shivagri-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: shiv-agri
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivagri-api-dev
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/shiv-agri
      NODE_ENV: development
      # Dev keeps direct container-to-container — no public domain or TLS to terminate.
      # Prod routes through nginx via a network alias (see docker-compose.prod.yml).
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL:-http://media-service:8081}
      MEDIA_SERVICE_PUBLIC_URL: ${MEDIA_SERVICE_PUBLIC_URL:-http://localhost:80}
      OTP_LOGIN_ENABLED: ${OTP_LOGIN_ENABLED:-true}
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-dev-api-key-change-me}
      WHATSAPP_OTP_TEMPLATE_NAME: ${WHATSAPP_OTP_TEMPLATE_NAME:-otp_login}
      WHATSAPP_OTP_TEMPLATE_LANGUAGE: ${WHATSAPP_OTP_TEMPLATE_LANGUAGE:-en}
      WHATSAPP_OTP_TEMPLATE_HAS_BUTTON: ${WHATSAPP_OTP_TEMPLATE_HAS_BUTTON:-true}
      DEFAULT_PHONE_COUNTRY_CODE: ${DEFAULT_PHONE_COUNTRY_CODE:-+91}
      DEFAULT_PHONE_SIGNUP_ROLE: ${DEFAULT_PHONE_SIGNUP_ROLE:-user}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - api_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: shivagri-media-dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: filesystem
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/shiv-agri
      MEDIA_STORAGE_FILESYSTEM_ROOT_DIR: /var/media/uploads
    ports:
      - "8081:8081"
    volumes:
      - /Users/mahirratanpara/shiv-agri-media:/var/media/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: shivagri-notification-dev
    restart: unless-stopped
    environment:
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-dev-api-key-change-me}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/shiv-agri
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-91}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_WEBHOOK_APP_SECRET: ${WHATSAPP_WEBHOOK_APP_SECRET:-}
      GMAIL_FROM_ADDRESS: ${GMAIL_FROM_ADDRESS:-}
      GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-Shiv-Agri}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
    ports:
      - "8082:8082"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shivagri-frontend-dev
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: shivagri-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend
    networks:
      - app-network

volumes:
  mongodb_data:
  mongodb_config:
  api_uploads:

networks:
  app-network:
    driver: bridge
