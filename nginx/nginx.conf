events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # DNS resolver for Docker - allows runtime DNS resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name shivagri.com www.shivagri.com;

        ssl_certificate /etc/letsencrypt/live/shivagri.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shivagri.com/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Media service endpoints
        location /api/v1/media {
            client_max_body_size 25m;
            limit_req zone=api_limit burst=20;
            set $media_upstream media-service:8081;
            proxy_pass http://$media_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal media location for X-Accel-Redirect
        location /internal-media/ {
            internal;
            alias /var/media/uploads/;
        }

        # Notification microservice — ONLY the messaging sub-paths.
        # /api/notifications (root) stays on the Node backend (in-app user notifications bell).
        # Carve out /api/notifications/whatsapp and /api/notifications/email for the
        # WhatsApp Cloud API + Gmail send service.
        location ~ ^/api/notifications/(whatsapp|email)(/|$) {
            client_max_body_size 30m;   # allow email attachments
            limit_req zone=api_limit burst=20;
            set $notification_upstream notification-service:8082;
            proxy_pass http://$notification_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints
        location /api {
            # Project media uploads (POST /api/projects/:id/media) accept up to
            # 5 files × 25 MB each at the multer layer — give nginx headroom over that.
            client_max_body_size 130m;
            # Long-running uploads / report generation shouldn't be killed at 60s.
            proxy_connect_timeout 30s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;

            limit_req zone=api_limit burst=20;
            # Use variable to force runtime DNS resolution
            set $api_upstream api:3000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Frontend
        location / {
            # Use variable to force runtime DNS resolution
            set $frontend_upstream frontend:80;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name shivagri.com www.shivagri.com;

        # Let's Encrypt challenge location
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
